  <g><rect class="f" x="4" y="4" width="20" height="82" rx="1" style="animation-duration:9s;animation-delay:-0s"/><rect class="f" x="40" y="4" width="20" height="82" rx="1" style="animation-duration:11s;animation-delay:-2.5s"/><rect class="f" x="76" y="4" width="20" height="82" rx="1" style="animation-duration:8s;animation-delay:-1s"/><rect class="f" x="112" y="4" width="20" height="82" rx="1" style="animation-duration:13s;animation-delay:-4s"/><rect class="f" x="148" y="4" width="20" height="82" rx="1" style="animation-duration:10s;animation-delay:-6s"/><rect class="f" x="184" y="4" width="20" height="82" rx="1" style="animation-duration:12s;animation-delay:-1.5s"/><rect class="f" x="220" y="4" width="20" height="82" rx="1" style="animation-duration:9.5s;animation-delay:-3s"/><rect class="f" x="256" y="4" width="20" height="82" rx="1" style="animation-duration:14s;animation-delay:-5s"/></g>
