<svg xmlns="http://www.w3.org/2000/svg" width="880" height="190" viewBox="0 0 880 190" role="img" aria-label="João Lucas Luz, Analista de Dados e BI, Toledo PR">
<style>
  .in { opacity: 0; animation: in .9s cubic-bezier(.2,.7,.2,1) forwards; }
  .d1 { animation-delay: .15s; } .d2 { animation-delay: .35s; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .f { fill: #B88400; transform-box: fill-box; transform-origin: 50% 100%;
        animation-name: dock; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
  @keyframes dock {
    0%, 12% { transform: scaleY(0); }
    40%, 70% { transform: scaleY(1); }
    100% { transform: scaleY(0); }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
</style>
<rect width="880" height="190" rx="6" fill="#F4F5F6"/>
<g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <text class="in" x="40" y="82" font-size="40" font-weight="700" fill="#15191E" letter-spacing="-0.5">João Lucas Luz</text>
  <text class="in d1" x="40" y="116" font-size="18" fill="#4F5863">Analista de Dados e BI · Toledo, PR</text>
  <text class="in d2" x="40" y="152" font-size="12.5" font-weight="600" fill="#7A838E" letter-spacing="1.6" xml:space="preserve">POWER BI  ·  PYTHON  ·  SQL  ·  MICROSOFT FABRIC</text>
</g>
<g transform="translate(560 46)">
  <line x1="0" y1="98" x2="280" y2="98" stroke="#D5DAE0" stroke-width="2"/>
