  <rect x="337" y="229" width="80" height="10" rx="2" fill="#E8B421" class="shrink" style="transform-origin:337px 211px"/>
</g>
</g>
<g class="c" style="animation-delay:0.36s">
  <rect x="449" y="147" width="430" height="128" rx="8" fill="#171B21" stroke="#2A3038"/>
  <rect x="449" y="169" width="3" height="40" fill="#E8B421"/>
  <text x="473" y="203" font-size="32" font-weight="700" fill="#F1F2F4" letter-spacing="-0.5">20 a 40 notas</text>
  <text x="473" y="235" font-size="14" fill="#9AA3AE">Por lote, faturadas do início ao fim</text>
  <text x="473" y="255" font-size="14" fill="#9AA3AE">sem ninguém acompanhando</text>
  <g>
  <g class="doc" style="animation-delay:0.0s"><rect x="783" y="193" width="22" height="28" rx="2" fill="#171B21" stroke="#39414B" stroke-width="1.5"/><line x1="788" y1="201" x2="800" y2="201" stroke="#39414B" stroke-width="1.5"/><line x1="788" y1="207" x2="800" y2="207" stroke="#39414B" stroke-width="1.5"/></g><g class="doc" style="animation-delay:0.75s"><rect x="783" y="193" width="22" height="28" rx="2" fill="#171B21" stroke="#39414B" stroke-width="1.5"/><line x1="788" y1="201" x2="800" y2="201" stroke="#39414B" stroke-width="1.5"/><line x1="788" y1="207" x2="800" y2="207" stroke="#39414B" stroke-width="1.5"/></g><g class="doc" style="animation-delay:1.5s"><rect x="783" y="193" width="22" height="28" rx="2" fill="#171B21" stroke="#39414B" stroke-width="1.5"/><line x1="788" y1="201" x2="800" y2="201" stroke="#39414B" stroke-width="1.5"/><line x1="788" y1="207" x2="800" y2="207" stroke="#39414B" stroke-width="1.5"/></g><g class="doc" style="animation-delay:2.25s"><rect x="783" y="193" width="22" height="28" rx="2" fill="#171B21" stroke="#39414B" stroke-width="1.5"/><line x1="788" y1="201" x2="800" y2="201" stroke="#39414B" stroke-width="1.5"/><line x1="788" y1="207" x2="800" y2="207" stroke="#39414B" stroke-width="1.5"/></g>
  <circle cx="857" cy="207" r="11" fill="#3FB27F" class="pulse" style="transform-origin:857px 207px"/>
  <path d="M852 207 l3.5 3.5 l6 -7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</g>
</g>
</svg>
