<svg xmlns="http://www.w3.org/2000/svg" width="880" height="276" viewBox="0 0 880 276" role="img" aria-label="Resultados: conciliação de estoque 1 vez por hora; 97,5% de precisão em documentos de exportação; canhotos para conferência manual caíram de 156 para 52; lotes de 20 a 40 notas faturados sem acompanhamento">
<style>
  .c { opacity: 0; animation: up .8s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .hand { animation: turn 6s linear infinite; }
  @keyframes turn { to { transform: rotate(360deg); } }
  .sweep { animation: sweep 6s linear infinite; }
  @keyframes sweep { to { stroke-dashoffset: 0; } }
  .ring { animation: ring 1.6s cubic-bezier(.3,.7,.2,1) .6s forwards; }
  @keyframes ring { to { stroke-dashoffset: 4.4; } }
  .tick { stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw .5s ease-out 2.1s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .shrink { animation: shrink 1.6s cubic-bezier(.3,.7,.2,1) .9s forwards; }
  @keyframes shrink { to { transform: scaleX(.333); } }
  .doc { opacity: 0; animation: doc 3s ease-in-out infinite; }
  @keyframes doc {
    0% { opacity: 0; transform: translateX(-8px); }
    15% { opacity: 1; transform: translateX(0); }
    70% { opacity: 1; transform: translateX(34px); }
    85%, 100% { opacity: 0; transform: translateX(42px); }
  }
  .pulse { animation: pulse 3s ease-in-out infinite; }
  @keyframes pulse { 0%, 60% { transform: scale(1); } 75% { transform: scale(1.15); } 90%, 100% { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; } .c { opacity: 1 !important; } .doc:first-child { opacity: 1 !important; }
    .ring { stroke-dashoffset: 4.4; } .tick { stroke-dashoffset: 0; } .shrink { transform: scaleX(.333); }
  }
</style>
<g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<g class="c" style="animation-delay:0.00s">
  <rect x="1" y="1" width="430" height="128" rx="8" fill="#171B21" stroke="#2A3038"/>
  <rect x="1" y="23" width="3" height="40" fill="#E8B421"/>
  <text x="25" y="57" font-size="32" font-weight="700" fill="#F1F2F4" letter-spacing="-0.5">1 por hora</text>
  <text x="25" y="89" font-size="14" fill="#9AA3AE">Conciliação de estoque ERP × 10</text>
  <text x="25" y="109" font-size="14" fill="#9AA3AE">armazéns. Antes: 2 manuais por dia</text>
  <g>
