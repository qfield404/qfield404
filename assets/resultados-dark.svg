  <line x1="381" y1="65" x2="381" y2="45" stroke="#F1F2F4" stroke-width="3" stroke-linecap="round" class="hand" style="transform-origin:381px 65px"/>
  <circle cx="381" cy="65" r="3.5" fill="#F1F2F4"/>
</g>
</g>
<g class="c" style="animation-delay:0.12s">
  <rect x="449" y="1" width="430" height="128" rx="8" fill="#171B21" stroke="#2A3038"/>
  <rect x="449" y="23" width="3" height="40" fill="#E8B421"/>
  <text x="473" y="57" font-size="32" font-weight="700" fill="#F1F2F4" letter-spacing="-0.5">97,5%</text>
  <text x="473" y="89" font-size="14" fill="#9AA3AE">Precisão na conferência de documentos</text>
  <text x="473" y="109" font-size="14" fill="#9AA3AE">de exportação, em 24 dossiês</text>
  <g>
  <circle cx="829" cy="65" r="28" fill="none" stroke="#2A3038" stroke-width="6"/>
  <circle cx="829" cy="65" r="28" fill="none" stroke="#3FB27F" stroke-width="6" stroke-linecap="round" stroke-dasharray="176" stroke-dashoffset="176" transform="rotate(-90 829 65)" class="ring"/>
  <path d="M819 65 l7 7 l13 -15" fill="none" stroke="#3FB27F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" class="tick"/>
</g>
</g>
<g class="c" style="animation-delay:0.24s">
  <rect x="1" y="147" width="430" height="128" rx="8" fill="#171B21" stroke="#2A3038"/>
  <rect x="1" y="169" width="3" height="40" fill="#E8B421"/>
  <text x="25" y="203" font-size="32" font-weight="700" fill="#F1F2F4" letter-spacing="-0.5">156 → 52</text>
  <text x="25" y="235" font-size="14" fill="#9AA3AE">Canhotos que pedem conferência</text>
  <text x="25" y="255" font-size="14" fill="#9AA3AE">manual, em 158 páginas reais</text>
  <g font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="10" fill="#6B7480">
